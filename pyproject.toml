[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casaradar"
version = "0.1.0"
description = "Radar pessoal de imóveis em Portugal: varre vários portais, deduplica, filtra e avisa no Telegram."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "pyyaml>=6",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.30"]

[project.scripts]
casaradar = "casaradar.cli:main"

[tool.setuptools.packages.find]
include = ["casaradar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
