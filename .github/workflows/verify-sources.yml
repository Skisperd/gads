# Verificação manual: obtém a 1ª página de cada fonte com o config de exemplo e mostra o que o parser extrai.
# Útil para confirmar URLs e seletores sem precisar de rodar em casa. Os HTML ficam como artifact.
name: verify-sources
on:
  workflow_dispatch:
  push:
    branches: [casaradar]
    paths: ["casaradar/**", ".github/workflows/verify-sources.yml", "config.example.yaml"]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: debug-fetch em todas as fontes
        run: |
          for s in imovirtual casasapo olx supercasa idealista; do
            echo "::group::$s"
            casaradar -c config.example.yaml debug-fetch "$s" --out dumps --show 8 || true
            echo "::endgroup::"
          done
      - name: esquema do JSON do Imovirtual
        run: |
          python - <<'PY'
          import glob, json, re
          files = glob.glob("dumps/imovirtual-*.html")
          if not files:
              print("sem dump do imovirtual"); raise SystemExit
          html = open(files[0], encoding="utf-8").read()
          m = re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>', html, re.S)
          data = json.loads(m.group(1))
          def find(o, k):
              if isinstance(o, dict):
                  if k in o: return o[k]
                  for v in o.values():
                      r = find(v, k)
                      if r is not None: return r
              if isinstance(o, list):
                  for v in o:
                      r = find(v, k)
                      if r is not None: return r
          sa = find(data, "searchAds")
          items = sa["items"]
          print("searchAds keys:", sorted(k for k in sa if k != "items"))
          print("pagination:", json.dumps(sa.get("pagination")))
          print("item keys:", sorted(items[0].keys()))
          for it in items[:2]:
              print(json.dumps(it, ensure_ascii=False)[:2500])
              print("---")
          print("roomsNumber:", [it.get("roomsNumber") for it in items])
          print("estate/transaction:", sorted({(it.get("estate"), it.get("transaction")) for it in items}))
          PY
      - name: sondas HTTP aos outros sites
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36'
          probe() {
            code=$(curl -sS -o /tmp/body -w '%{http_code}' -m 25 -L -A "$UA" \
              -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              -H 'Accept-Language: pt-PT,pt;q=0.9,en;q=0.6' \
              -H 'Sec-Ch-Ua: "Chromium";v="128", "Google Chrome";v="128", "Not;A=Brand";v="24"' \
              -H 'Sec-Ch-Ua-Mobile: ?0' -H 'Sec-Ch-Ua-Platform: "Windows"' \
              -H 'Sec-Fetch-Dest: document' -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Site: none' -H 'Sec-Fetch-User: ?1' \
              -H 'Upgrade-Insecure-Requests: 1' "$1" || echo ERR)
            echo "$code  $(wc -c </tmp/body) bytes  $1"
            grep -o -i -m1 'cloudflare\|datadome\|captcha\|incapsula\|akamai\|perimeterx\|Too Many Requests\|Access Denied' /tmp/body | head -1 | sed 's/^/     marcador: /'
          }
          probe https://casa.sapo.pt/
          probe https://casa.sapo.pt/alugar-apartamentos/lisboa/
          probe https://supercasa.pt/
          probe https://supercasa.pt/arrendar-apartamentos/lisboa
          probe https://www.olx.pt/
          probe https://www.olx.pt/imoveis/
          probe 'https://www.olx.pt/api/v1/offers/?offset=0&limit=5&category_id=1&query=t2'
          probe https://www.idealista.pt/
          probe https://www.imovirtual.com/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dumps
          path: dumps/
          if-no-files-found: ignore
